<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahmaran | Combo Düzenleyici</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080808;
            --sidebar-bg: #111111;
            --accent-red: #8b0000; 
            --accent-red-bright: #ff0000;
            --text-light: #e0e0e0;
            --text-dim: #a0a0a0;
            --border-color: #2a2a2a;
            --telegram-blue: #0088cc;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            height: 70px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 2px solid var(--accent-red);
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.3);
            z-index: 10;
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        
        /* Logo Görünmeme Sorunu İçin Fix */
        .main-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px var(--accent-red));
        }

        .logo-text { 
            font-weight: 800; 
            font-size: 22px; 
            letter-spacing: -0.5px; 
            color: #fff;
            text-transform: uppercase;
        }
        .logo-text span { color: var(--accent-red-bright); }

        /* Sosyal Link Grupları */
        .nav-links { display: flex; gap: 15px; }

        .telegram-link {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 136, 204, 0.1);
            color: var(--telegram-blue);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid var(--telegram-blue);
            transition: 0.4s;
            letter-spacing: 1px;
        }

        .telegram-link:hover { 
            background: var(--telegram-blue); 
            color: #fff;
            transform: translateY(-3px); 
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.4);
        }

        .telegram-link i { font-size: 18px; }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* --- YAN MENÜ --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px 0;
            overflow-y: auto;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            text-align: left;
            padding: 15px 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
            width: 100%;
            text-transform: uppercase;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            padding-left: 28px;
            border-left: 4px solid var(--accent-red-bright);
        }

        .tool-btn.active-tool {
            background: var(--accent-red);
            color: #fff;
            border-left: 4px solid var(--accent-red-bright);
        }

        /* --- İÇERİK --- */
        .content {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: radial-gradient(circle at center, #111 0%, #080808 100%);
        }

        .textarea-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 5px;
        }

        .stats-label {
            font-size: 11px;
            color: #777;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-value {
            font-size: 22px;
            color: var(--accent-red-bright);
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        textarea {
            flex: 1;
            background: #020202;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #00ff00; /* Klasik terminal yeşili veya #fff */
            padding: 20px;
            resize: none;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            line-height: 1.6;
            outline: none;
            box-shadow: inset 0 0 30px rgba(0,0,0,1);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0d0d;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .file-label { 
            color: #fff;
            font-size: 11px; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            padding: 8px 15px;
            border: 1px dashed #444;
            border-radius: 6px;
            transition: 0.3s;
        }
        .file-label:hover { border-color: var(--accent-red-bright); color: var(--accent-red-bright); }

        .btn-group { display: flex; gap: 12px; }

        .action-btn {
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit { background: #fff; color: #000; }
        .btn-submit:hover { background: var(--accent-red-bright); color: #fff; transform: translateY(-2px); }

        .btn-download { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .btn-download:hover { background: #252525; border-color: #555; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-container">
        <img src="logo-removebg-preview.png" alt="SHM" class="main-logo" onerror="this.src='https://via.placeholder.com/45/8b0000/FFFFFF?text=SHM'">
        <div class="logo-text">Sahmaran<span>Combo</span></div>
    </div>
    
    <div class="nav-links">
        <a href="https://t.me/TheKingOfTheGlory001" target="_blank" class="telegram-link">
            <i class="fa-brands fa-telegram"></i>
            <span>TELEGRAM</span>
        </a>
    </div>
</nav>

<div class="main-container">
    <aside class="sidebar">
        <button class="tool-btn active-tool" data-tool="urlToUserPass" onclick="selectTool(this)">URL:USER:PASS → USER:PASS</button>
        <button class="tool-btn" data-tool="cleanMail" onclick="selectTool(this)">USER:PASS TEMİZLE</button>
        <button class="tool-btn" data-tool="cleanUser" onclick="selectTool(this)">MAIL:PASS TEMİZLE</button>
        <button class="tool-btn" data-tool="removeCapture" onclick="selectTool(this)">CAPTURE SİLİCİ</button>
        <button class="tool-btn" data-tool="removeDuplicates" onclick="selectTool(this)">AYNI SATIRLARI TEMİZLE</button>
        <button class="tool-btn" data-tool="removeEmpty" onclick="selectTool(this)">BOŞ SATIRLARI TEMİZLE</button>
        <button class="tool-btn" data-tool="sortAZ" onclick="selectTool(this)">A-Z SIRALA</button>
        <button class="tool-btn" data-tool="randomize" onclick="selectTool(this)">KARIŞTIR</button>
        <button class="tool-btn" data-tool="sepOutlook" onclick="selectTool(this)">OUTLOOK & HOTMAIL AYIRICI</button>
    </aside>

    <main class="content">
        <div class="textarea-header">
            <span class="stats-label"><i class="fa-solid fa-code"></i> Combolist Düzenleyici</span>
            <div>
                <span class="stats-label">TOPLAM SATIR:</span>
                <span id="lineCount" class="stats-value">0</span>
            </div>
        </div>

        <textarea id="comboInput" placeholder="Combo listenizi buraya yapıştırın veya dosya yükleyin..." oninput="updateStats()"></textarea>

        <div class="controls">
            <label class="file-label">
                <input type="file" style="display:none" onchange="loadFile(event)">
                <i class="fa-solid fa-file-import"></i> DOSYA YÜKLE
            </label>
            
            <div class="btn-group">
                <button class="action-btn btn-submit" onclick="applyAction()">Uygula</button>
                <button class="action-btn btn-download" onclick="downloadTxt()">Dosyayı İndir</button>
            </div>
        </div>
    </main>
</div>

<script>
    // JS kodların aynı kalabilir, sadece görselleştirme yaptık.
    let currentTool = "urlToUserPass";

    function updateStats() {
        const text = document.getElementById("comboInput").value;
        const lines = text.split('\n').filter(l => l.trim() !== "").length;
        document.getElementById("lineCount").innerText = lines.toLocaleString();
    }

    function selectTool(btn) {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
        btn.classList.add('active-tool');
        currentTool = btn.getAttribute('data-tool');
    }

    function applyAction() {
        const input = document.getElementById("comboInput");
        if (!input.value.trim()) return;

        let lines = input.value.split('\n');

        switch(currentTool) {
            case "urlToUserPass":
                lines = lines.map(l => {
                    let p = l.split(":");
                    return p.length >= 3 ? p[p.length-2] + ":" + p[p.length-1] : l;
                });
                break;
            case "cleanMail":
                lines = lines.filter(l => l.includes("@"));
                break;
            case "cleanUser":
                lines = lines.filter(l => !l.includes("@"));
                break;
            case "removeCapture":
                lines = lines.map(l => l.split("|")[0].trim());
                break;
            case "removeDuplicates":
                lines = [...new Set(lines)];
                break;
            case "removeEmpty":
                lines = lines.filter(l => l.trim() !== "");
                break;
            case "sortAZ":
                lines = lines.sort((a, b) => a.localeCompare(b));
                break;
            case "randomize":
                lines = lines.sort(() => Math.random() - 0.5);
                break;
            case "sepOutlook":
                lines = lines.filter(l => /outlook|hotmail|live|msn/i.test(l));
                break;
        }
        
        input.value = lines.join('\n');
        updateStats();
        
        const btn = document.querySelector('.btn-submit');
        btn.innerText = "BAŞARILI!";
        setTimeout(() => btn.innerText = "UYGULA", 1500);
    }

    function loadFile(e) {
        const reader = new FileReader();
        reader.onload = () => {
            document.getElementById("comboInput").value = reader.result;
            updateStats();
        };
        reader.readAsText(e.target.files[0]);
    }

    function downloadTxt() {
        const content = document.getElementById("comboInput").value;
        if(!content) return alert("İndirilecek içerik yok!");
        const blob = new Blob([content], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "sahmaran_combo_result.txt";
        a.click();
    }
</script>

</body>
</html>
