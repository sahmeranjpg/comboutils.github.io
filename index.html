<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahmaran | Combo Düzenleyici</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #080808;
            --sidebar-bg: #111111;
            --accent-red: #8b0000; 
            --accent-red-bright: #ff0000;
            --text-light: #e0e0e0;
            --text-dim: #a0a0a0;
            --border-color: #2a2a2a;
            --telegram-blue: #0088cc;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            height: 70px;
            min-height: 70px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 2px solid var(--accent-red);
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.3);
            z-index: 100;
        }

        .logo-container { display: flex; align-items: center; gap: 10px; }
        .main-logo { width: 35px; height: 35px; object-fit: contain; }
        .logo-text { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; color: #fff; text-transform: uppercase; }
        .logo-text span { color: var(--accent-red-bright); }

        .telegram-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 136, 204, 0.1);
            color: var(--telegram-blue);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid var(--telegram-blue);
            transition: 0.3s;
        }

        .telegram-link:hover { background: var(--telegram-blue); color: #fff; }

        /* --- ANA TAYŞICI --- */
        .main-container { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            flex-direction: row; /* Masaüstü varsayılan */
        }

        /* --- YAN MENÜ (SIDEBAR) --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow-y: auto;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            text-align: left;
            padding: 15px 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
            width: 100%;
            text-transform: uppercase;
            white-space: nowrap; /* Mobilde taşmayı önler */
        }

        .tool-btn:hover { background: rgba(255, 255, 255, 0.03); color: #fff; border-left-color: var(--accent-red-bright); }
        .tool-btn.active-tool { background: var(--accent-red); color: #fff; border-left-color: var(--accent-red-bright); }

        /* --- İÇERİK ALANI --- */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: radial-gradient(circle at center, #111 0%, #080808 100%);
            overflow: hidden;
        }

        .textarea-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .stats-label { font-size: 10px; color: #777; font-weight: 800; text-transform: uppercase; }
        .stats-value { font-size: 18px; color: var(--accent-red-bright); font-weight: 900; }

        textarea {
            flex: 1;
            background: #020202;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 15px;
            resize: none;
            font-size: 13px;
            font-family: 'Consolas', monospace;
            outline: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- BUTONLAR VE DOSYA --- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #0d0d0d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .file-label { 
            color: #aaa;
            font-size: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            text-align: center;
            padding: 10px;
            border: 1px dashed #333;
            border-radius: 6px;
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .action-btn {
            padding: 12px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            font-size: 10px;
            text-transform: uppercase;
        }

        .btn-submit { background: #fff; color: #000; }
        .btn-download { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        /* --- MOBİL UYUMLULUK (BREAKPOINTS) --- */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; } /* Yan yana olan yapıyı alt alta yap */

            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row; /* Butonları yan yana diz */
                overflow-x: auto; /* Yatay kaydırma aç */
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 5px 0;
            }

            .tool-btn {
                padding: 12px 15px;
                border-left: none;
                border-bottom: 3px solid transparent;
                width: auto;
            }
            
            .tool-btn.active-tool {
                border-left: none;
                border-bottom-color: var(--accent-red-bright);
            }

            .logo-text { font-size: 16px; }
            .content { padding: 15px; }
            .stats-value { font-size: 16px; }
            
            .navbar { padding: 0 10px; }
        }

        /* Yatay Kaydırma Çubuğunu Gizle (Sidebar için) */
        .sidebar::-webkit-scrollbar { height: 0px; display: none; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-container">
        <img src="logo-removebg-preview.png" alt="SHM" class="main-logo" onerror="this.src='https://via.placeholder.com/35/8b0000/FFFFFF?text=S'">
        <div class="logo-text">Sahmaran<span>Combo</span></div>
    </div>
    
    <a href="https://t.me/TheKingOfTheGlory001" target="_blank" class="telegram-link">
        <i class="fa-brands fa-telegram"></i>
        <span>TELEGRAM</span>
    </a>
</nav>

<div class="main-container">
    <aside class="sidebar">
        <button class="tool-btn active-tool" data-tool="urlToUserPass" onclick="selectTool(this)">URL:USER:PASS → USER:PASS</button>
        <button class="tool-btn" data-tool="cleanMail" onclick="selectTool(this)">USER:PASS TEMİZLE</button>
        <button class="tool-btn" data-tool="cleanUser" onclick="selectTool(this)">MAIL:PASS TEMİZLE</button>
        <button class="tool-btn" data-tool="removeCapture" onclick="selectTool(this)">CAPTURE SİLİCİ</button>
        <button class="tool-btn" data-tool="removeDuplicates" onclick="selectTool(this)">TEKRARLARI SİL</button>
        <button class="tool-btn" data-tool="removeEmpty" onclick="selectTool(this)">BOŞLARI SİL</button>
        <button class="tool-btn" data-tool="sortAZ" onclick="selectTool(this)">A-Z SIRALA</button>
        <button class="tool-btn" data-tool="randomize" onclick="selectTool(this)">KARIŞTIR</button>
        <button class="tool-btn" data-tool="sepOutlook" onclick="selectTool(this)">OUTLOOK AYIRICI</button>
    </aside>

    <main class="content">
        <div class="textarea-header">
            <span class="stats-label"><i class="fa-solid fa-terminal"></i> Terminal</span>
            <div>
                <span class="stats-label">SATIR:</span>
                <span id="lineCount" class="stats-value">0</span>
            </div>
        </div>

        <textarea id="comboInput" placeholder="Combo buraya..." oninput="updateStats()"></textarea>

        <div class="controls">
            <label class="file-label">
                <input type="file" style="display:none" onchange="loadFile(event)">
                <i class="fa-solid fa-upload"></i> DOSYA YÜKLE
            </label>
            
            <div class="btn-group">
                <button class="action-btn btn-submit" onclick="applyAction()">Uygula</button>
                <button class="action-btn btn-download" onclick="downloadTxt()">İndir</button>
            </div>
        </div>
    </main>
</div>

<script>
    let currentTool = "urlToUserPass";

    function updateStats() {
        const text = document.getElementById("comboInput").value;
        const lines = text.split('\n').filter(l => l.trim() !== "").length;
        document.getElementById("lineCount").innerText = lines.toLocaleString();
    }

    function selectTool(btn) {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
        btn.classList.add('active-tool');
        currentTool = btn.getAttribute('data-tool');
    }

    function applyAction() {
        const input = document.getElementById("comboInput");
        if (!input.value.trim()) return;

        let lines = input.value.split('\n');

        switch(currentTool) {
            case "urlToUserPass":
                lines = lines.map(l => {
                    let p = l.split(":");
                    return p.length >= 3 ? p[p.length-2] + ":" + p[p.length-1] : l;
                });
                break;
            case "cleanMail":
                lines = lines.filter(l => l.includes("@"));
                break;
            case "cleanUser":
                lines = lines.filter(l => !l.includes("@"));
                break;
            case "removeCapture":
                lines = lines.map(l => l.split("|")[0].trim());
                break;
            case "removeDuplicates":
                lines = [...new Set(lines)];
                break;
            case "removeEmpty":
                lines = lines.filter(l => l.trim() !== "");
                break;
            case "sortAZ":
                lines = lines.sort((a, b) => a.localeCompare(b));
                break;
            case "randomize":
                lines = lines.sort(() => Math.random() - 0.5);
                break;
            case "sepOutlook":
                lines = lines.filter(l => /outlook|hotmail|live|msn/i.test(l));
                break;
        }
        
        input.value = lines.join('\n');
        updateStats();
        
        const btn = document.querySelector('.btn-submit');
        btn.innerText = "TAMAM!";
        setTimeout(() => btn.innerText = "UYGULA", 1500);
    }

    function loadFile(e) {
        const reader = new FileReader();
        reader.onload = () => {
            document.getElementById("comboInput").value = reader.result;
            updateStats();
        };
        reader.readAsText(e.target.files[0]);
    }

    function downloadTxt() {
        const content = document.getElementById("comboInput").value;
        if(!content) return;
        const blob = new Blob([content], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "sahmaran_result.txt";
        a.click();
    }
</script>

</body>
</html>
