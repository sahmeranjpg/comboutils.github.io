<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahmaran | Combo Düzenleyici</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-color: #050505;
            --sidebar-bg: #0d0d0d;
            --accent-red: #8b0000; 
            --accent-red-bright: #ff0000;
            --terminal-green: #00ff41;
            --border-color: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; }
        textarea { -webkit-user-select: text !important; user-select: text !important; }

        body {
            height: 100vh; background-color: var(--bg-color); color: #fff;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .navbar {
            height: 70px; background: #000; display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--accent-red); z-index: 100;
        }

        .logo-text { font-weight: 800; font-size: 20px; text-transform: uppercase; }
        .logo-text span { color: var(--accent-red-bright); }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 10px 0; overflow-y: auto;
        }

        .tool-btn {
            background: transparent; border: none; color: #777; text-align: left;
            padding: 14px 20px; font-size: 11px; font-weight: 700; cursor: pointer;
            text-transform: uppercase; border-left: 4px solid transparent; transition: 0.2s;
        }

        .tool-btn.active-tool { background: rgba(139, 0, 0, 0.3); color: #fff; border-left-color: var(--accent-red-bright); }

        .content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; background: #000; }

        .terminal-bg-gif {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://media1.tenor.com/m/WzEMvflT360AAAAC/atat%C3%BCrk-t%C3%BCrkiye.gif');
            background-size: cover; background-position: center; opacity: 0.15; z-index: 1; pointer-events: none;
        }

        textarea {
            flex: 1; background: rgba(0, 0, 0, 0.7) !important; backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 0, 0, 0.3) !important; border-radius: 8px;
            color: var(--terminal-green); padding: 15px; font-family: 'JetBrains Mono', monospace;
            font-size: 13px; position: relative; z-index: 5; outline: none; resize: none;
        }

        .controls {
            display: flex; gap: 15px; background: #0d0d0d; padding: 15px; border-radius: 8px; z-index: 10;
        }

        .action-btn {
            flex: 1; padding: 12px; border-radius: 5px; font-weight: 800; cursor: pointer;
            border: none; font-size: 11px; text-transform: uppercase; transition: 0.3s;
        }

        .btn-submit { background: #fff; color: #000; }
        .btn-submit:hover { background: var(--accent-red-bright); color: #fff; }
        .btn-download { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border-color); }
            .tool-btn { padding: 15px; white-space: nowrap; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-text">Sahmaran<span>Combo</span></div>
    <a href="https://t.me/TheKingOfTheGlory001" target="_blank" style="color:#0088cc; text-decoration:none; font-weight:800; font-size:12px;">TELEGRAM</a>
</nav>

<div class="main-container">
    <aside class="sidebar">
        <button class="tool-btn active-tool" data-tool="urlToUserPass" onclick="selectTool(this)">URL:USER:PASS -> USER:PASS</button>
        <button class="tool-btn" data-tool="cleanMail" onclick="selectTool(this)">SADECE MAIL:PASS</button>
        <button class="tool-btn" data-tool="cleanUser" onclick="selectTool(this)">SADECE USER:PASS</button>
        <button class="tool-btn" data-tool="removeCapture" onclick="selectTool(this)">CAPTURE SİLİCİ</button>
        <button class="tool-btn" data-tool="removeDuplicates" onclick="selectTool(this)">TEKRARLARI SİL</button>
        <button class="tool-btn" data-tool="removeEmpty" onclick="selectTool(this)">BOŞ SATIRLARI SİL</button>
        <button class="tool-btn" data-tool="sortAZ" onclick="selectTool(this)">A-Z SIRALA</button>
        <button class="tool-btn" data-tool="sepOutlook" onclick="selectTool(this)">HOTMAIL/OUTLOOK AYIR</button>
    </aside>

    <main class="content">
        <div class="terminal-bg-gif"></div>
        <div style="display:flex; justify-content:space-between; position:relative; z-index:10; font-size:11px; font-weight:800;">
            <span style="color:#aaa;">SAHMARAN TERMINAL</span>
            <span style="color:red;">SATIR: <span id="lineCount">0</span></span>
        </div>
        <textarea id="comboInput" placeholder="Comboyu yapıştır..." oninput="updateStats()"></textarea>
        <div class="controls">
            <input type="file" id="fileInp" style="display:none" onchange="loadFile(event)">
            <button class="action-btn btn-download" onclick="document.getElementById('fileInp').click()">DOSYA AKTAR</button>
            <div class="btn-group" style="display:flex; gap:10px; flex:1;">
                <button class="action-btn btn-submit" onclick="applyAction()">BAŞLAT</button>
                <button class="action-btn btn-download" onclick="downloadTxt()">İNDİR</button>
            </div>
        </div>
    </main>
</div>

<script>
    let currentTool = "urlToUserPass";

    function updateStats() {
        const val = document.getElementById("comboInput").value;
        const lines = val.split('\n').filter(l => l.trim() !== "").length;
        document.getElementById("lineCount").innerText = lines;
    }

    function selectTool(btn) {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
        btn.classList.add('active-tool');
        currentTool = btn.getAttribute('data-tool');
    }

    function loadFile(e) {
        const reader = new FileReader();
        reader.onload = () => { document.getElementById("comboInput").value = reader.result; updateStats(); };
        reader.readAsText(e.target.files[0]);
    }

    function downloadTxt() {
        const content = document.getElementById("comboInput").value;
        if(!content) return;
        const blob = new Blob([content], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "sahmaran_fixed.txt";
        a.click();
    }

    function applyAction() {
        const input = document.getElementById("comboInput");
        let lines = input.value.split('\n').filter(l => l.trim() !== "");
        if (lines.length === 0) return;

        let result = [];

        lines.forEach(line => {
            let cleanLine = line.trim();
            
            switch(currentTool) {
                case "urlToUserPass":
                    // http://site.com:user:pass -> user:pass mantığı
                    let parts = cleanLine.split(':');
                    if (parts.length >= 3) {
                        result.push(parts[parts.length-2] + ":" + parts[parts.length-1]);
                    } else {
                        result.push(cleanLine);
                    }
                    break;

                case "cleanMail":
                    if (cleanLine.includes("@") && cleanLine.includes(":")) result.push(cleanLine);
                    break;

                case "cleanUser":
                    if (!cleanLine.includes("@") && cleanLine.includes(":")) result.push(cleanLine);
                    break;

                case "removeCapture":
                    // Hem | hem de boşluklu | ayıklama
                    let noCap = cleanLine.split('|')[0].split(' |')[0].trim();
                    // Eğer capture : sonrasındaysa (mail:pass:capture)
                    let subParts = noCap.split(':');
                    if(subParts.length > 2) {
                        result.push(subParts[0] + ":" + subParts[1]);
                    } else {
                        result.push(noCap);
                    }
                    break;

                case "removeDuplicates":
                    // Bu işlem döngü dışında yapılacak
                    result.push(cleanLine);
                    break;

                case "sepOutlook":
                    if (/@(outlook|hotmail|live|msn)/i.test(cleanLine)) result.push(cleanLine);
                    break;

                default:
                    result.push(cleanLine);
            }
        });

        if (currentTool === "removeDuplicates") result = [...new Set(result)];
        if (currentTool === "sortAZ") result.sort();
        if (currentTool === "removeEmpty") result = result.filter(l => l.length > 0);

        input.value = result.join('\n');
        updateStats();
        
        const btn = document.querySelector('.btn-submit');
        btn.innerText = "BAŞARILI!";
        setTimeout(() => btn.innerText = "BAŞLAT", 1000);
    }

    // --- KORUMALAR ---
    document.addEventListener('contextmenu', e => {
        e.preventDefault();
        Swal.fire({title:'HOP!', text:'Sahmaran Kodlarını Çalamazsın!', icon:'error', background:'#000', color:'#ff0000'});
    });

    document.onkeydown = (e) => {
        if(e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73))) {
            return false;
        }
    };
</script>
</body>
</html>
