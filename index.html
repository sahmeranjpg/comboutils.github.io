<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahmaran | Combo Düzenleyici</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050505;
            --sidebar-bg: #0d0d0d;
            --accent-red: #8b0000; 
            --accent-red-bright: #ff0000;
            --text-light: #e0e0e0;
            --border-color: #1a1a1a;
            --telegram-blue: #0088cc;
            --terminal-green: #00ff41;
        }

        /* Metin seçmeyi engelleme */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }

        /* Textarea içinde yazı yazabilmek için seçmeye izin ver */
        textarea {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        body {
            height: 100vh;
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* NAVBAR */
        .navbar {
            height: 70px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid var(--accent-red);
            z-index: 100;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .main-logo { width: 40px; height: 40px; }
        .logo-text { font-weight: 800; font-size: 20px; text-transform: uppercase; }
        .logo-text span { color: var(--accent-red-bright); }

        .telegram-link {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0, 136, 204, 0.1);
            color: var(--telegram-blue);
            text-decoration: none; padding: 10px 16px; border-radius: 8px;
            font-size: 12px; font-weight: 800; border: 1px solid var(--telegram-blue);
        }

        /* MAIN CONTAINER */
        .main-container { display: flex; flex: 1; overflow: hidden; flex-direction: row; }

        /* SIDEBAR */
        .sidebar {
            width: 300px; background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 15px 0; overflow-y: auto;
        }

        .tool-btn {
            background: transparent; border: none; color: #777;
            text-align: left; padding: 16px 20px; font-size: 11px; font-weight: 700;
            cursor: pointer; width: 100%; text-transform: uppercase; border-left: 4px solid transparent;
        }

        .tool-btn.active-tool { 
            background: rgba(139, 0, 0, 0.3); color: #fff; border-left-color: var(--accent-red-bright); 
        }

        /* CONTENT */
        .content {
            flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px;
            position: relative; background: #000; overflow: hidden;
        }

        .terminal-bg-gif {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://media1.tenor.com/m/WzEMvflT360AAAAC/atat%C3%BCrk-t%C3%BCrkiye.gif');
            background-size: cover; background-position: center; opacity: 0.2; z-index: 1; pointer-events: none;
        }

        textarea {
            flex: 1; background: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(5px); border: 1px solid rgba(255, 0, 0, 0.2) !important;
            border-radius: 10px; color: var(--terminal-green); padding: 20px;
            font-size: 14px; font-family: 'JetBrains Mono', monospace;
            position: relative; z-index: 5;
        }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
            background: #0d0d0d; padding: 15px 20px; border-radius: 10px;
            z-index: 10; gap: 15px;
        }

        .btn-group { display: flex; gap: 10px; flex: 1; }

        .action-btn {
            flex: 1; padding: 12px; border-radius: 6px; font-weight: 800;
            cursor: pointer; border: none; font-size: 11px; text-transform: uppercase;
        }

        .btn-submit { background: #fff; color: #000; }
        .btn-download { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; overflow-x: auto; }
            .tool-btn { white-space: nowrap; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body oncontextmenu="return false;"> <nav class="navbar">
    <div class="logo-container">
        <img src="logo-removebg-preview.png" alt="SHM" class="main-logo" onerror="this.src='https://via.placeholder.com/40/8b0000/FFFFFF?text=S'">
        <div class="logo-text">Sahmaran<span>Combo</span></div>
    </div>
    <a href="https://t.me/TheKingOfTheGlory001" target="_blank" class="telegram-link">
        <i class="fa-brands fa-telegram"></i> <span>TELEGRAM</span>
    </a>
</nav>

<div class="main-container">
    <aside class="sidebar">
        <button class="tool-btn active-tool" data-tool="urlToUserPass" onclick="selectTool(this)">URL:USER:PASS → USER:PASS</button>
        <button class="tool-btn" data-tool="cleanMail" onclick="selectTool(this)">USER:PASS TEMİZLE</button>
        <button class="tool-btn" data-tool="cleanUser" onclick="selectTool(this)">MAIL:PASS TEMİZLE</button>
        <button class="tool-btn" data-tool="removeCapture" onclick="selectTool(this)">CAPTURE SİLİCİ</button>
        <button class="tool-btn" data-tool="removeDuplicates" onclick="selectTool(this)">TEKRARLARI TEMİZLE</button>
        <button class="tool-btn" data-tool="removeEmpty" onclick="selectTool(this)">BOŞ SATIRLARI SİL</button>
        <button class="tool-btn" data-tool="sortAZ" onclick="selectTool(this)">A-Z SIRALA</button>
        <button class="tool-btn" data-tool="randomize" onclick="selectTool(this)">LİSTEYİ KARIŞTIR</button>
        <button class="tool-btn" data-tool="sepOutlook" onclick="selectTool(this)">OUTLOOK & HOTMAIL AYIR</button>
    </aside>

    <main class="content">
        <div class="terminal-bg-gif"></div>
        <div class="textarea-header">
            <span class="stats-label"><i class="fa-solid fa-code-branch"></i> SAHMARAN COMBOUTİLS</span>
            <span id="lineCount" class="stats-value">0</span>
        </div>
        <textarea id="comboInput" placeholder="Combo listesi bekleniyor..."></textarea>
        <div class="controls">
            <input type="file" id="fileInp" style="display:none" onchange="loadFile(event)">
            <button class="action-btn btn-download" onclick="document.getElementById('fileInp').click()">DOSYA AKTAR</button>
            <div class="btn-group">
                <button class="action-btn btn-submit" onclick="applyAction()">BAŞLAT</button>
                <button class="action-btn btn-download" onclick="downloadTxt()">İNDİR</button>
            </div>
        </div>
    </main>
</div>

<script>
    // --- TEMEL FONKSİYONLAR ---
    let currentTool = "urlToUserPass";
    function selectTool(btn) {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
        btn.classList.add('active-tool');
        currentTool = btn.getAttribute('data-tool');
    }

    // (Buraya daha önceki applyAction, updateStats, loadFile fonksiyonlarını ekle...)

    // --- SÜPER KORUMA SİSTEMİ ---

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // Mesaj fonksiyonu
    function sahmaranUyari(mesaj, baslik = "HOP!") {
        Swal.fire({
            title: baslik,
            text: mesaj,
            icon: 'error',
            background: '#0d0d0d',
            color: '#ff0000',
            confirmButtonColor: '#8b0000',
            confirmButtonText: 'Tamam abi, özür dilerim'
        });
    }

    // 1. Sağ Tık Engeli ve Mesajı
    document.addEventListener('contextmenu', event => {
        event.preventDefault();
        sahmaranUyari("Sağ tıkla kod çalmaya çalışmak mı? Sahmaran seni izliyor...", "YEMEZLER!");
    });

    // 2. Klavye Kısayolları Engeli ve Mesajları
    document.onkeydown = function(e) {
        // F12
        if(e.keyCode == 123) {
            sahmaranUyari("F12'ye basınca hacker mı oldun şimdi?", "DUR PEZEWENG!");
            return false;
        }
        // Ctrl+U (Kaynak Kodu)
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
            sahmaranUyari("Kodlarımızı mı merak ettin? Çok zorlama, kafan karışır.", "KAYNAK KAPALI!");
            return false;
        }
        // Ctrl+Shift+I / J / C (İncele)
        if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) {
            sahmaranUyari("Geliştirici araçlarını kapat dostum, burada sana ekmek çıkmaz.", "GİRİŞ YASAK!");
            return false;
        }
        // Ctrl+S (Kaydet)
        if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) {
            sahmaranUyari("Sayfayı kaydedip ne yapacaksın? Çerçeveletip asacak mısın?", "KOLEKSİYONCU MUYUZ?");
            return false;
        }
    };

    // 3. Debugger Tespit Edilirse (Konsol açılırsa)
    let debugCount = 0;
    setInterval(function() {
        const start = new Date();
        debugger;
        const end = new Date();
        if (end - start > 100) {
            debugCount++;
            if(debugCount === 1) {
                sahmaranUyari("Konsolu açtığını gördüm. Kapatmazsan sayfa kendini imha edecek!", "DİKKAT!");
            }
        }
    }, 2000);

    // 4. Yazı Seçme Engeli (Textarea hariç)
    document.addEventListener('selectstart', (e) => {
        if (e.target.tagName !== 'TEXTAREA') {
            // Buraya alert koymuyorum çünkü çok sıkıcı olur, sadece engelliyoruz.
            e.preventDefault();
        }
    });

    // 5. Konsola "Hava Atan" Mesajlar
    console.log("%cDUR BURADA!", "color: red; font-size: 40px; font-weight: bold; text-shadow: 2px 2px black;");
    console.log("%cSahmaran Combo Editor'ın mutfağına hoş geldin ama sadece bakabilirsin, dokunamazsın.", "color: white; font-size: 15px;");
    console.log("%cTelegram: https://t.me/TheKingOfTheGlory001", "color: #0088cc; font-size: 12px; font-style: italic;");

    // 5. Görselleri Sürüklemeyi Engelleme
    document.querySelectorAll('img').forEach(img => {
        img.onmousedown = (e) => e.preventDefault();
    });
</script>

</body>
</html>
